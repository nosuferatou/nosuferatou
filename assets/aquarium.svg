    <linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1931" />
      <stop offset="60%" stop-color="#061224" />
      <stop offset="100%" stop-color="#030813" />
    </linearGradient>

    <!-- Caustic Light Pattern -->
